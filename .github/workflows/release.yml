name: Publish developer preview
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag
        required: true
        default: v0.0.1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" build
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - name: Publish pre-release and distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag --prerelease
          --title "Bowden-PII $RELEASE_TAG — Developer preview"
          --notes-file CHANGELOG.md
