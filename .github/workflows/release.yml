name: Publish developer preview
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" build
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - name: Publish pre-release and distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --prerelease
          --title "Bowden-PII $GITHUB_REF_NAME — Developer preview"
          --notes-file CHANGELOG.md
