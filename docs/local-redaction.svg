<text x="48" y="58" font-size="15" letter-spacing="2">LOCAL PYTHON RUNTIME</text>
<g stroke="#57645a" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M218 128 H268"/><path d="M472 128 H518"/><path d="M698 128 H772"/><path d="M370 163 V214"/></g>
<g stroke="#c3d1ba" fill="#fffef8"><rect x="48" y="94" width="170" height="69" rx="8"/><rect x="518" y="94" width="180" height="69" rx="8"/><rect x="268" y="218" width="240" height="57" rx="8"/></g>
