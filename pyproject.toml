[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bowden-pii"
version = "0.0.1"
description = "Local-first Swiss/EU PII detection and redaction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "bowden-pii contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.urls]
Homepage = "https://bowden-pii.com"
Repository = "https://github.com/48Nauts-Operator/bowden-pii"
Issues = "https://github.com/48Nauts-Operator/bowden-pii/issues"

[project.scripts]
bowden-pii = "bowden_pii.cli:main"
bowden-pii-benchmark = "bowden_pii.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
